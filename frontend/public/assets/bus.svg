<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="-10 -10 120 120" width="100" height="100">
  <!--
    Equilateral-ish triangle:
      points = (50,0), (100,100), (0,100)
    stroke-width = 20 → corner radius ≈10
  -->
  <polygon
    points="50,0 100,100 0,100"
    fill="black"
    stroke="black"
    stroke-linejoin="round"
    stroke-width="20"
  />
</svg>