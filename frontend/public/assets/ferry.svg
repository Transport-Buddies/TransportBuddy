<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="-10 -10 120 220"
  width="100"
  height="200"
>
  <!--
    - stroke-width = 20 → corner radius ≈10
    - stroke-linejoin="round" rounds every joint
    - viewBox is expanded by 10 units to avoid clipping
  -->
  <polygon
    points="50,0 100,50 100,200 0,200 0,50"
    fill="black"
    stroke="black"
    stroke-linejoin="round"
    stroke-width="20"
  />
</svg>